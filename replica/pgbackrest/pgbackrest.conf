#[global]
#repo1-path=/var/lib/pgbackrest
#spool-path=/var/spool/pgbackrest

#[main]
#pg1-path=/var/lib/postgresql/17/data

[global]
repo1-path=/example/
repo1-bundle=y
repo1-retention-full=2

repo1-type=s3
repo1-s3-bucket=backups
repo1-s3-endpoint=http://localhost:9000
repo1-s3-region=us-east-1

repo1-s3-key=$MINIO_ACCESS_KEY
repo1-s3-key-secret=$MINIO_SECRET_KEY

repo1-s3-uri-style=path
repo1-s3-verify-tls=y

log-level-console=detail
log-level-file=debug
compress-level=6
delta=y
start-fast=y

[main]
pg1-user=postgres
pg1-host-user=root
pg1-host=primary
pg1-path=/var/lib/postgresql/data

pg2-user=root
pg2-path=/var/lib/postgresql/data

[global:archive-push]
compress-level=6
